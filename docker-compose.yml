services:
  postgres:
    image: postgres:16-alpine
    container_name: expenses-control-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: expenses_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
        -c pg_hba.conf=/etc/pg_hba.conf
        -c log_statement=all
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/database/000_full_schema.sql:/docker-entrypoint-initdb.d/000_full_schema.sql
      - ./pg_hba_custom.conf:/etc/pg_hba.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d expenses_control']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
